services:
  postgres:
    image: postgres:16-alpine
    container_name: mozporn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mozporn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
      POSTGRES_DB: mozporn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mozporn_pgdata:/var/lib/postgresql/data

volumes:
  mozporn_pgdata:
