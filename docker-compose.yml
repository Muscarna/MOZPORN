services:
  postgres:
    image: postgres:16-alpine
    container_name: mozporn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mozporn
      POSTGRES_PASSWORD: mozporn_dev_password
      POSTGRES_DB: mozporn
    ports:
      - "5432:5432"
    volumes:
      - mozporn_pgdata:/var/lib/postgresql/data

volumes:
  mozporn_pgdata:
